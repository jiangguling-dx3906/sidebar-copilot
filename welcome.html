<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar Copilot</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page welcome">
      <header class="hero">
        <img src="icons/icon128.png" alt="" class="hero-icon" />
        <div>
          <h1 data-i18n="welcome.title">Sidebar Copilot 已安装</h1>
          <p data-i18n="welcome.subtitle">在任意网页右侧打开 AI 侧边栏，让它读这页、答你的问题。</p>
        </div>
      </header>

      <section class="card">
        <div class="steps">
          <div class="step">
            <span class="step-num">1</span>
            <p data-i18n-html="welcome.step1"></p>
          </div>
          <div class="step">
            <span class="step-num">2</span>
            <p data-i18n-html="welcome.step2"></p>
          </div>
          <div class="step">
            <span class="step-num">3</span>
            <p data-i18n-html="welcome.step3"></p>
          </div>
        </div>

        <div class="cta">
          <button id="openOptions" class="primary" type="button" data-i18n="welcome.openSettings">打开设置</button>
          <button id="closeTab" class="ghost" type="button" data-i18n="welcome.close">关闭此页</button>
        </div>
      </section>

      <footer class="foot">
        <span data-i18n="welcome.footer">分析在本地完成，只有你发的请求会到达模型服务。</span>
        <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener" data-i18n="welcome.getKey">获取 DeepSeek Key</a>
      </footer>
    </main>

    <script type="module" src="welcome.js"></script>
  </body>
</html>
