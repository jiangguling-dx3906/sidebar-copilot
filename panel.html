<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar Copilot</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon48.png" alt="" class="brand-icon" />
          <div class="brand-text">
            <strong>Sidebar Copilot</strong>
            <span id="modelLabel">deepseek-chat</span>
          </div>
        </div>
        <div class="top-actions">
          <button
            id="newChat"
            class="icon-btn"
            data-i18n-title="common.newChat"
            data-i18n-aria-label="common.newChat"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button id="actionsToggle" class="icon-btn" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3.5 12 20l2.2-6.2L20.5 11 5 3.5Z" />
            </svg>
          </button>
          <button
            id="openSettings"
            class="icon-btn"
            data-i18n-title="common.settings"
            data-i18n-aria-label="common.settings"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M4 7h9M19 7h1M4 17h3M13 17h7" />
              <circle cx="15" cy="7" r="2.2" />
              <circle cx="9" cy="17" r="2.2" />
            </svg>
          </button>
        </div>
      </header>

      <section class="pagebar" id="pagebar">
        <img id="pageFavicon" class="page-favicon" alt="" />
        <div class="page-meta">
          <div class="page-title" id="pageTitle" data-i18n="panel.statusReading">正在读取页面…</div>
          <div class="page-sub" id="pageSub">—</div>
        </div>
        <label class="switch" data-i18n-title="panel.attachTitle">
          <input type="checkbox" id="attachToggle" checked />
          <span></span>
        </label>
        <button
          id="refreshPage"
          class="icon-btn small"
          data-i18n-title="common.refresh"
          data-i18n-aria-label="common.refresh"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 5.6" />
            <path d="M20 5v6h-6" />
          </svg>
        </button>
      </section>

      <div class="banner hidden" id="keyBanner">
        <div data-i18n="panel.banner">还没有配置 API Key，配置后才能对话。</div>
        <button id="bannerSettings" class="text-btn" data-i18n="panel.bannerAction">去设置</button>
      </div>

      <main class="scroll" id="scroll">
        <div class="empty" id="emptyState">
          <img src="icons/icon128.png" alt="" class="empty-icon" />
          <h2 data-i18n="panel.emptyTitle">就这个页面，问点什么</h2>
          <p id="emptyHint"></p>
          <div class="prompt-grid" id="promptGrid"></div>
        </div>
        <div class="messages" id="messages"></div>
      </main>

      <footer class="composer">
        <div class="selection-chip hidden" id="selectionChip">
          <span class="dot"></span>
          <span id="selectionText"></span>
          <button id="clearSelection" data-i18n-title="panel.clearSelection" data-i18n-aria-label="panel.clearSelection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="input-wrap" id="inputWrap">
          <textarea id="input" rows="1" data-i18n-placeholder="panel.placeholder"></textarea>
          <button id="send" class="send-btn" data-i18n-title="common.send" data-i18n-aria-label="common.send" disabled>
            <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M6 11l6-6 6 6" />
            </svg>
          </button>
        </div>
        <div class="statusbar">
          <span id="status" data-i18n="panel.statusInit">正在初始化…</span>
          <span class="kbd">Alt+Shift+S</span>
        </div>
      </footer>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
